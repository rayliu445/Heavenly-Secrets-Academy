spring:
  cloud:
    nacos:
      discovery:
        namespace: f923fb34-cb0a-4c06-8fca-ad61ea61a3f0
        group: DEFAULT_GROUP
        ip: 127.0.0.1
      config:
        # 配置中心地址
        server-addr: 127.0.0.1:8848
        # 配置文件格式
        file-extension: yaml
        # 共享配置
        # shared-dataids: application-${spring.profiles.active}.${spring.cloud.nacos.config.file-extension}
        # 本地默认为Public命名空间,可以省略不写，新建的命名空间，需要使用命名空间ID， 不能使用名称
        namespace: f923fb34-cb0a-4c06-8fca-ad61ea61a3f0
        #指定配置群组 --如果是Public命名空间 则可以省略群组配置
        # group: DEFAULT_GROUP
        group: DEFAULT_GROUP
logging:
  level:
    com.tianji: debug

seata:
  # nacos配置
  config:
    type: nacos
    nacos:
      server-addr: 127.0.0.1:8848
      namespace:
      group: SEATA_GROUP
      username:
      password:
      context-path:
      data-id: seataServer.properties
      #if use MSE Nacos with auth, mutex with username/password attribute
      #access-key:
      #secret-key:
  registry:
    # nacos配置
    type: nacos
    nacos:
      application: seata-server
      server-addr: 127.0.0.1:8848
      group: SEATA_GROUP
      namespace:
      cluster: default
      username:
      password:
      context-path: